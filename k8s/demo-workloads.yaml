# The 5 "production" workloads the demo watches.
# Apply to a real Minikube cluster so Config Cop's Cluster Ops panel can use real
# `kubectl scale` / `kubectl rollout status` (CLUSTER_MODE=real or auto).
# The config *fingerprinting / drift detection* itself is simulated in the API.
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: prod
  labels: { app: checkout-api, demo: config-cop }
spec:
  replicas: 3
  selector: { matchLabels: { app: checkout-api } }
  template:
    metadata: { labels: { app: checkout-api } }
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: FEATURE_PAYMENTS_V2, value: "true" }
            - { name: DB_POOL_SIZE, value: "10" }
            - { name: TIMEOUT_MS, value: "2000" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: prod
  labels: { app: payments-worker, demo: config-cop }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments-worker } }
  template:
    metadata: { labels: { app: payments-worker } }
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: QUEUE_CONCURRENCY, value: "8" }
            - { name: DB_POOL_SIZE, value: "12" }
            - { name: RETRY_LIMIT, value: "5" }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 400m, memory: 1Gi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: prod
  labels: { app: auth-service, demo: config-cop }
spec:
  replicas: 4
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          env:
            - { name: LOG_LEVEL, value: "warn" }
            - { name: TOKEN_TTL_SECONDS, value: "900" }
            - { name: SESSION_SECRET_ROTATION, value: "enabled" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: prod
  labels: { app: inventory-api, demo: config-cop }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory-api } }
  template:
    metadata: { labels: { app: inventory-api } }
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: CACHE_TTL, value: "60" }
            - { name: DB_POOL_SIZE, value: "6" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-consumer
  namespace: prod
  labels: { app: notification-consumer, demo: config-cop }
spec:
  replicas: 3
  selector: { matchLabels: { app: notification-consumer } }
  template:
    metadata: { labels: { app: notification-consumer } }
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: SMTP_RATE_LIMIT, value: "100" }
            - { name: BATCH_SIZE, value: "50" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
